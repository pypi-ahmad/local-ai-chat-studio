name: CI

on:
  push:
  pull_request:

jobs:
  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmd /c "Launch Chat Studio.cmd --check"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bash -n './Launch Chat Studio.sh'
      - run: bash './Launch Chat Studio.sh' --check
      - run: uv sync --locked --dev
      - run: uv run python -m pytest -q
      - run: uv run ruff check backend tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
