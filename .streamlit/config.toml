[theme]
base = "dark"
primaryColor = "#2DD4BF"            # teal accent (buttons, focus, links)
backgroundColor = "#0F1419"          # near-black slate
secondaryBackgroundColor = "#1A2230" # sidebar / input wells
textColor = "#E8EAED"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 100
