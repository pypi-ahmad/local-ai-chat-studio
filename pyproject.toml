[project]
name = "local-ai-chat-studio"
version = "0.6.5"
description = "A local-first, ChatGPT-style AI chat studio over Ollama with optional BYOK cloud providers, built-in memory, and self-improving personalization."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "chromadb>=1.5.9",
    "ddgs>=9.14.4",
    "fastapi>=0.139.2",
    "google-genai>=2.13.0",
    "loguru>=0.7.3",
    "ollama>=0.6.2",
    "openai>=2.41.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
    "xlrd>=2.0.2",
]

[project.scripts]
chat-studio = "backend.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]
